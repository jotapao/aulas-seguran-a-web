<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <div> <input type="email" name="email" placeholder="Enter your email" required> </div>
                <div> <input type="password" name="password" placeholder="Enter your password" required> </div>
                        <div> <input type="password" name="confirm_password" placeholder="Confirm your password" required> </div>
                     <div><button type="submit">Entrar</button></div>
                    </form>
                    <script>
                        document.querySelector('form').addEventListener('submit', function(event) {
                            event.preventDefault(); // Prevent form submission
                        
                            const email = document.querySelector('input[name="email"]').value;
                            const password = document.querySelector('input[name="password"]').value;
                            const confirmPassword = document.querySelector('input[name="confirm_password"]').value;
                        
                            if (password !== confirmPassword) {
                                alert("Passwords do not match!");
                                return;
                            }
                        
                            // Proceed with form submission or further processing
                            console.log("Email:", email);
                            console.log("Password:", password);
                        });
                    </script>
</body>
</html
